name: CI

# One repo, several packages. Siblings are checked out alongside because the
# generators depend on them through "workspace:*", which only resolves inside a
# workspace root — so the job assembles a throwaway one.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: generators
      - uses: actions/checkout@v4
        with:
          repository: voxolith/engine
          path: engine
      - uses: actions/checkout@v4
        with:
          repository: voxolith/renderer
          path: renderer
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Assemble a workspace root
        run: |
          cat > package.json <<'JSON'
          { "name": "ci-workspace", "private": true, "workspaces": ["generators/*", "engine", "renderer"] }
          JSON
      - run: bun install
      - run: bun run --cwd generators typecheck
      - run: bun run --cwd generators verify
      # Every generator at every parameter extreme against the EntityGenerator contract.
      - run: bun run --cwd generators/contract full

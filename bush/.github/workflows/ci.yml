name: CI

# This package depends on its siblings through bun's "workspace:*", so a bare
# clone cannot resolve them. They are checked out alongside and a throwaway
# workspace root assembled, the same way the app repos build for Pages.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: gen-bush
      - uses: actions/checkout@v4
        with:
          repository: voxolith/engine
          path: engine
      - uses: actions/checkout@v4
        with:
          repository: voxolith/renderer
          path: renderer
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Assemble a workspace root
        run: |
          cat > package.json <<'JSON'
          { "name": "ci-workspace", "private": true, "workspaces": ["gen-bush", "engine", "renderer"] }
          JSON
      - run: bun install
      - run: bun run --cwd gen-bush typecheck
      - name: Headless generator checks
        run: bun run --cwd gen-bush verify

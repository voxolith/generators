name: Publish to npm

# Publishes @voxolith/gen-grass when a version tag (v1.2.3) is pushed. The tag
# must match package.json "version". Needs the NPM_TOKEN repository secret (an
# npm automation token with publish rights on the @voxolith scope).
#
# Siblings are checked out alongside because this package depends on them
# through "workspace:*"; bun rewrites those to concrete versions on publish.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: gen-grass
      - uses: actions/checkout@v4
        with:
          repository: voxolith/engine
          path: engine
      - uses: actions/checkout@v4
        with:
          repository: voxolith/renderer
          path: renderer
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Assemble a workspace root
        run: |
          cat > package.json <<'JSON'
          { "name": "publish-workspace", "private": true, "workspaces": ["gen-grass", "engine", "renderer"] }
          JSON
      - run: bun install
      - run: bun run --cwd gen-grass typecheck
      - run: bun run --cwd gen-grass verify
      - name: Check tag matches package.json version
        working-directory: gen-grass
        run: |
          pkg="v$(jq -r .version package.json)"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi
      - name: Publish
        working-directory: gen-grass
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun publish --access public
      - name: GitHub release
        working-directory: gen-grass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
